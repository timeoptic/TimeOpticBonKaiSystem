    <div class="brand">
      <span class="brand-mark"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.4 10.5a4.6 4.6 0 1 0 4.5 5.4h2.2a4.6 4.6 0 1 0 .3-2H10.6a4.6 4.6 0 0 0-4.2-3.4zm0 2a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2zm11.2 0a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2z"/><path d="M4.3 11.6 2.4 11 4 6.2l1.9.6zm15.4 0 1.9-.6L19.9 6.2l-1.9.6z"/></svg></span>

      <a class="btn btn-ghost" href="#/"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.1 2.6 10.9l1.3 1.5.6-.5V20a1.5 1.5 0 0 0 1.5 1.5h4V15h4v6.5h4A1.5 1.5 0 0 0 19.5 20v-8.1l.6.5 1.3-1.5z"/></svg>เมนูหลัก</a>
